
name: Build EDITH APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build EDITH Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project files
        run: |
          echo "Checking EDITH project..."
          find . -maxdepth 5 -type f | sort
          test -f EDITH-appnew/settings.gradle
          test -f EDITH-appnew/build.gradle
          test -f EDITH-appnew/app/build.gradle

      - name: Check Gradle modules
        working-directory: ./EDITH-appnew
        run: gradle projects

      - name: Build EDITH APK
        working-directory: ./EDITH-appnew
        run: gradle :app:assembleDebug

      - name: Upload EDITH APK
        uses: actions/upload-artifact@v4
        with:
          name: EDITH-APK
          path: EDITH-appnew/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
